name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    name: Source privacy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify privacy-check rules
        run: python3 scripts/privacy-check.py --self-test
      - name: Check publishable source
        run: python3 scripts/privacy-check.py --tracked

  macos:
    name: macOS tests and app builds
    # The official xcode-27 image includes the macOS 27 SDK used by the
    # optional eager namespace policy. It is currently a public preview.
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify toolchain and local SFTP fixture
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
          swift --version
          test -x /usr/libexec/sftp-server
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test Core
        run: swift test --package-path Core
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Debug app and extensions
        run: >-
          xcodebuild -project benSync.xcodeproj -scheme benSync
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build Release app and extensions
        run: >-
          xcodebuild -project benSync.xcodeproj -scheme benSync
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
